<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#153E75" />
    <meta
      name="description"
      content="Team Ulysse : un pack de cartes sécurité à ouvrir chaque jour, à collectionner en équipe."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Team Ulysse" />
    <title>Team Ulysse · La sécurité, notre Odyssée</title>
    <style>
      /* Écran de lancement : affiché dès l'ouverture, jusqu'à ce que l'appli soit prête. */
      html,
      body {
        background: #0b2347;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #1e4c8c 0%, #153e75 38%, #0b2347 72%);
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        transition: opacity 0.35s ease;
      }
      #boot.fini {
        opacity: 0;
        pointer-events: none;
      }
      #boot .rayons {
        position: absolute;
        left: 50%;
        top: 38%;
        width: 900px;
        height: 900px;
        margin: -450px 0 0 -450px;
        border-radius: 50%;
        background: repeating-conic-gradient(
          rgba(245, 197, 66, 0.12) 0 8deg,
          transparent 8deg 22deg
        );
        -webkit-mask: radial-gradient(circle, #000 12%, transparent 60%);
        mask: radial-gradient(circle, #000 12%, transparent 60%);
        animation: boot-tourne 40s linear infinite;
      }
      #boot img {
        position: relative;
        height: min(34vh, 260px);
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.5));
        animation: boot-flotte 2.4s ease-in-out infinite;
      }
      #boot h1 {
        position: relative;
        margin: 18px 0 0;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #boot .slogan {
        position: relative;
        margin: 4px 0 0;
        color: #f5c542;
        font-size: 15px;
        font-weight: 700;
        font-style: italic;
      }
      #boot .barre {
        position: relative;
        width: min(70vw, 260px);
        height: 12px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.12);
      }
      #boot .barre i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 99px;
        background: repeating-linear-gradient(135deg, #f5c542 0 10px, #15171c 10px 20px);
        animation: boot-charge 1.3s ease-in-out infinite;
      }
      #boot .astuce {
        position: relative;
        max-width: 300px;
        margin: 22px 0 0;
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        line-height: 1.45;
      }
      #boot button {
        position: relative;
        margin-top: 16px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #f5c542;
        color: #0b2347;
        font:
          700 15px system-ui,
          sans-serif;
        cursor: pointer;
      }
      #boot [hidden] {
        display: none;
      }
      @keyframes boot-charge {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @keyframes boot-flotte {
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes boot-tourne {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="rayons"></div>
      <img src="./mascotte.webp" alt="" />
      <h1>Team Ulysse</h1>
      <p class="slogan">La sécurité, notre Odyssée</p>
      <div class="barre" id="boot-spin"><i></i></div>
      <p class="astuce" id="boot-msg"></p>
      <button id="boot-retry" hidden onclick="location.reload()">Recharger la page</button>
    </div>
    <div id="root"></div>
    <script>
      // Si l'application ne démarre pas (script introuvable, navigateur trop ancien, erreur),
      // on l'explique au lieu de laisser une page vide.
      (function () {
        // Une astuce sécurité au hasard pendant le chargement.
        var astuces = [
          '💡 Le bon réflexe : EPI avant d’entrer dans l’atelier.',
          '💡 Une allée dégagée, c’est une évacuation plus rapide.',
          '💡 Pas de téléphone en marchant dans les zones de circulation.',
          '💡 Un doute sur une machine ? On consigne avant d’intervenir.',
          '💡 Repère l’extincteur le plus proche de ton poste.',
          '💡 Une charge lourde ? On se fait aider ou on utilise une aide.',
        ];
        document.getElementById('boot-msg').textContent =
          astuces[Math.floor(Math.random() * astuces.length)];
        function fail(detail) {
          var boot = document.getElementById('boot');
          if (!boot) return; // l'application a démarré
          document.getElementById('boot-spin').hidden = true;
          document.getElementById('boot-msg').textContent =
            'L’appli n’a pas pu démarrer. Recharge la page ; si le problème persiste, mets à jour ton téléphone.' +
            (detail ? ' (' + detail + ')' : '');
          document.getElementById('boot-retry').hidden = false;
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t.tagName === 'SCRIPT') fail('script introuvable');
            else if (e.message) fail(e.message);
          },
          true,
        );
        setTimeout(function () {
          fail();
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
