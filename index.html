<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#153E75" />
    <meta
      name="description"
      content="Vigie : un pack de cartes sécurité à ouvrir chaque jour, à collectionner en équipe."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Vigie · Sécurité au travail</title>
    <style>
      /* Écran affiché tant que l'application n'a pas démarré : jamais de page blanche. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #f5f7fa;
        color: #153e75;
        font:
          600 15px/1.5 system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
      }
      #boot .spin {
        width: 36px;
        height: 36px;
        border: 4px solid #eaf2fa;
        border-top-color: #f5c542;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot button {
        margin-top: 4px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #f5c542;
        color: #0b2347;
        font: inherit;
        cursor: pointer;
      }
      #boot [hidden] {
        display: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="spin" id="boot-spin"></div>
        <p id="boot-msg">Chargement de Vigie…</p>
        <button id="boot-retry" hidden onclick="location.reload()">Recharger la page</button>
      </div>
    </div>
    <script>
      // Si l'application ne démarre pas (script introuvable, navigateur trop ancien, erreur),
      // on l'explique au lieu de laisser une page vide.
      (function () {
        function fail(detail) {
          var boot = document.getElementById('boot');
          if (!boot) return; // l'application a démarré
          document.getElementById('boot-spin').hidden = true;
          document.getElementById('boot-msg').textContent =
            'Vigie n’a pas pu démarrer. Rechargez la page ; si le problème persiste, mettez à jour votre navigateur.' +
            (detail ? ' (' + detail + ')' : '');
          document.getElementById('boot-retry').hidden = false;
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t.tagName === 'SCRIPT') fail('script introuvable');
            else if (e.message) fail(e.message);
          },
          true,
        );
        setTimeout(function () {
          fail();
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
